[binaries]
c = 'clang'
strip = 'llvm-strip'

[host_machine]
system     = 'none'
cpu_family = 'arm'
cpu        = 'cortex-m3'
endian     = 'little'

# Set the target during compiler/linker detection too (including on macOS).
[built-in options]
c_args = ['--target=arm-none-eabi', '-mcpu=cortex-m3', '-mthumb']
c_link_args = ['--target=arm-none-eabi', '-fuse-ld=lld']
